apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-ingress
  namespace: backend
  labels:
    app.kubernetes.io/name: backend-ingress
spec:
  ingressClassName: traefik
  rules:
  - host: backend.chatapp.com
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: backend-service
            port: 
              number: 3001
